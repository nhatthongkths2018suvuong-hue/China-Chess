plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cotuong.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.cotuong.game"
        minSdk 16          // nếu Android Studio báo lỗi, đổi thành 19
        targetSdk 25       // Android 7.1.x
        versionCode 1
        versionName "1.0"
        // Không có thư viện native => APK chạy trên mọi ABI (armeabi, armeabi-v7a, arm64...)
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding "UTF-8"
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
